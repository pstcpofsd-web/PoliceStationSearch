name: Build Windows EXE and Release

on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/build-release.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:

    runs-on: windows-latest

    steps:

      # 1. Get repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install required packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 4. Read version from app.py
      - name: Get application version
        id: version
        shell: powershell
        run: |
          $content = Get-Content app.py -Raw

          if ($content -match 'APP_VERSION\s*=\s*"([^"]+)"') {
              $version = $matches[1]
          }
          else {
              Write-Error "APP_VERSION not found in app.py"
              exit 1
          }

          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Application Version: $version"

      # 5. Build EXE
      - name: Build Windows EXE
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PoliceStationSearch `
            app.py

      # 6. Check EXE
      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist\PoliceStationSearch.exe")) {
              Write-Error "EXE was not created!"
              exit 1
          }

          $size = (Get-Item "dist\PoliceStationSearch.exe").Length

          Write-Host "EXE created successfully."
          Write-Host "Size: $size bytes"

      # 7. Create GitHub Release and upload EXE
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Police Station Search v${{ steps.version.outputs.VERSION }}
          body: |
            ## Police Station Search v${{ steps.version.outputs.VERSION }}

            Windows EXE automatically built by GitHub Actions.

            ### Installation
            Download `PoliceStationSearch.exe` and run it on Windows.

          files: |
            dist/PoliceStationSearch.exe
          generate_release_notes: true
